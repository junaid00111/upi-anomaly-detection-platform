<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <!-- Rounded app-icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Shield outline -->
  <path d="M256 56 L424 120 V250 C424 350 352 420 256 456 C160 420 88 350 88 250 V120 Z" fill="url(#shield)"/>
  <path d="M256 80 L402 135 V250 C402 337 340 398 256 430 C172 398 110 337 110 250 V135 Z" fill="url(#inner)"/>

  <!-- Faint grid -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.5">
    <line x1="130" y1="200" x2="382" y2="200"/>
    <line x1="130" y1="270" x2="382" y2="270"/>
    <line x1="130" y1="340" x2="382" y2="340"/>
  </g>

  <!-- Rupee symbol -->
  <g fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M214 150 H298"/>
    <path d="M214 176 H298"/>
    <path d="M214 150 H236 C268 150 268 200 236 200 H214 L284 250"/>
  </g>

  <!-- Transaction signal with anomaly spike -->
  <path d="M130 322 H196 L218 300 L240 332 L262 322 L286 262 L312 366 L334 322 H382"
        fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Anomaly marker -->
  <circle cx="286" cy="262" r="26" fill="none" stroke="#f43f5e" stroke-width="5" opacity="0.5"/>
  <circle cx="286" cy="262" r="14" fill="#f43f5e"/>
  <circle cx="286" cy="262" r="5" fill="#fff"/>
</svg>
